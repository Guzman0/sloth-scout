# Render Blueprint: publishes the site/ folder as a free Static Site.
# The daily GitHub Action builds site/ (index.html + brief.mp3) and commits it to
# main; Render notices the commit and redeploys. There's nothing to build here.
services:
  - type: web
    runtime: static
    name: sloth-scout
    branch: main
    buildCommand: echo "Nothing to build. site/ is generated by the daily GitHub Action."
    staticPublishPath: ./site
    # Only redeploy when the published files change, not for code-only commits.
    buildFilter:
      paths:
        - site/**
    headers:
      # The page and audio change every morning, so browsers should always check for a new copy.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
